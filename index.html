<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meu Github</title>
    <link rel="stylesheet" href="main.css">
</head>
<body>
    <header>
        <div class="container">
            <img class="profile-avatar" src="https://via.placeholder.com/180x180" id="avatar" alt=".">
            <h1 class="profile-name" id="name">Eduardo santos</h1>
            <h2 class="profile-username" id="user-Name">@Eduardo_sant</h2>
            <ul class="numbers">
                <li class="numbers-item">
                    <h4>Repositórios</h4>
                    <span id="repor"></span>
                </li>
                <li class="numbers-item">
                    <h4>Seguidores</h4>
                    <span id="followers"></span>
                </li>
                <li class="numbers-item">
                    <h4>Seguindo</h4>
                    <span id="following"></span>
                </li>
            </ul>
            <a href="#" id="link" class="profile-link">Ver no Github</a>
        </div>
    </header>

    <script>
        document.addEventListener("DOMContentLoaded", function() {
            const ProfileName = document.getElementById('name');
            const userName = document.getElementById('user-Name');
            const imgAvatar = document.getElementById('avatar');
            const repor = document.getElementById('repor');
            const followers = document.getElementById('followers');
            const following = document.getElementById('following');
            const link = document.getElementById('link');

            fetch('https://api.github.com/users/baysory')
                .then(function(res) {
                    return res.json();
                })
                .then(function(json) {
                    ProfileName.textContent = json.name;
                    userName.textContent = '@' + json.login;
                    imgAvatar.src = json.avatar_url;
                    repor.textContent = json.public_repos;
                    followers.textContent = json.followers;
                    following.textContent = json.following;
                    link.href = json.html_url;
                })


        })
    </script>
</body>
</html>
